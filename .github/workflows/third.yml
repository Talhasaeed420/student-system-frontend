name: Third-Worflow
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: 

jobs:
  talha:
    runs-on: ubuntu-latest      
    steps: 
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup node js
        uses: actions/setup-node@v4
          with: 
            node-version: '20'
      - name: Install dependencies
        run: npm install
    