name: Second Workflow

on:
  push:
    branches: [main]

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5001/api

  jobdone:
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - name: Job Completion
        run: echo "Job is completed"