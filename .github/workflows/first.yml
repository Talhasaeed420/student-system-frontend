name: First Workflow

on:
  push:
    branches: [main]

jobs:
  talha:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Say hello
        run: echo "Gonna install some dependencies"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build