name: "Job Concurrency"
on:
  push:
    branches: [main]
jobs:
  talha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Dependency and cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm 
      - name: Dependency
        run: npm run build
      - name: Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact save
          path: dist/
    concurrency:
      group: New commits
      cancel-in-progress: true 

