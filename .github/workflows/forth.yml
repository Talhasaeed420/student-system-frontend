name: "test"
on:
  push:
    branches: [main]
  schedule: 
    - cron: '0 9 * * *'   
  workflow_dispatch:
jobs:
  talha:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18,19,20]
    steps: 
      - name: check code
        uses: actions/checkout@v4
      - name: node setup
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node}}
          cache: npm
      - name: install dependencies
        run: npm install
      - name: run
        run: npm run build
      - name: artifact 
        uses: actions/upload-artifact@v4
        with:
          group: ref-${{github.ref}}
          path: dist/



        