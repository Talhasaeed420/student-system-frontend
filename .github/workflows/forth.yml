name: "Fourth Workflow"
on:
  push: 
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  talha:
    runs-on: ubuntu-latest
    steps:
      - name: Download repo
        uses: actions/checkout@v4
      - name: Install Node 
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dependency install
        run: npm install
      - name: Start running
        run: npm run build   
      - name: Print completion
        run: echo "Job 1 done"

  saeed:
    runs-on: ubuntu-latest
    needs: talha
    steps:
      - name: Completion print
        run: echo "Talha and saeed job done"