name: "Last action"
on:
  push:
    branches: [main]
  schedule:
    - cron: 0 9 * * * 
  workflow_dispatch:
concurrency:
  group: branches-${{github.ref}}
  cancel-in-progress: true

jobs:
  talha:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18,19,20]
    steps:
      - name: Check code
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node}}
          cache: npm 
      - name: Install 
        run: npm install
      - name: build
        run: npm run build

      - name: artifacts
        uses: actions/upload-artifact@v4
        with: 
          name: Artifact made
          path: dist/


          