name: "Fifth workflow"
on:
  push: 
    branches: [main]

jobs: 
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Run build 
        run: npm run build

      - name: Save the build logs
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts save
          path: dist/